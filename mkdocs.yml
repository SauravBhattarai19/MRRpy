site_name: MRRpy
site_description: MRRpy (Multi-Mechanism Runoff and Routing) — a distributed, physics-based hydrological + hydrodynamic model for rainfall-runoff generation and grid-based flood routing, driven by open satellite data.
site_url: https://mrrpy.readthedocs.io/
repo_url: https://github.com/SauravBhattarai19/MRRpy
repo_name: MRRpy
docs_dir: docsite

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - "Ways to set up a run": getting-started/interfaces.md
  - User manual:
      - manual/index.md
      - "1 Terrain": manual/terrain.md
      - "2 Coordinate system": manual/coordinate-system.md
      - "3 Precipitation": manual/precipitation.md
      - "4 Runoff": manual/runoff.md
      - "5 Routing":
          - "5.1–5.3 Method and time": manual/routing.md
          - "5.4 Ground roughness": manual/roughness.md
          - "5.5 River channels": manual/channels.md
          - "5.6 Water entering from upstream": manual/inflows.md
      - "6 Outputs and run": manual/outputs.md
      - Google Earth Engine: manual/earth-engine.md
      - All settings A–Z: manual/all-settings.md
  - Examples:
      - examples/index.md
      - "1 Your first run": examples/first-run.md
      - "2 Download a DEM": examples/download-dem.md
      - "3 Compare routing methods": examples/routing-schemes.md
      - "4 Runoff methods": examples/runoff-methods.md
      - "5 Physical runoff processes": examples/physical-runoff.md
      - "6 Rain gauges": examples/rain-gauges.md
      - "7 A real storm from satellite": examples/satellite-storm.md
      - "8 Route an inflow hydrograph": examples/inflow-hydrograph.md
      - "9 Roughness and river channels": examples/roughness-channels.md
      - "10 The whole DEM and flood maps": examples/whole-dem.md
      - "11 Many runs from Python": examples/batch-runs.md
      - "12 Flood depth and extent maps": examples/flood-maps.md
      - "Case study: Nepal (Trishuli)": examples/nepal-case-study.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/api.md
      - For developers: reference/developers.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Settings tables and [[NAME]] links come from MRRpy/config_schema.py.
hooks:
  - tools/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: numpy
            separate_signature: true
            show_signature_annotations: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SauravBhattarai19/MRRpy
