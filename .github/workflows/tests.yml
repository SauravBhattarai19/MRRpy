name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]   # ubuntu-latest (26.04) has no Python 3.9
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The other operating systems, on the oldest and a recent Python.
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install MRRpy (core) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Show environment
        run: |
          python -c "import MRRpy, numpy, numba, rasterio, pysheds, pyflwdir; print('MRRpy', MRRpy.__version__, 'numpy', numpy.__version__, 'numba', numba.__version__)"
          MRRpy doctor --offline

      - name: Lint (real faults only: syntax errors, undefined names)
        run: ruff check MRRpy tests MRRpy_plugin

      - name: Run test suite
        run: pytest -v --cov=MRRpy --cov-report=term-missing:skip-covered

      - name: Run the demo
        run: MRRpy demo demo_out
