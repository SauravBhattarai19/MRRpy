name: Draft PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/paper.md'
      - 'paper/paper.bib'
      - 'paper/*.png'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    paths:
      - 'paper/paper.md'
      - 'paper/paper.bib'
      - 'paper/*.png'
      - '.github/workflows/draft-pdf.yml'
  workflow_dispatch: {}

# Lets the job commit the rebuilt paper/paper.pdf back to main.
permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
      # Pull requests only get the artifact; pushes to main also keep the
      # committed PDF in step with paper.md. Commits made with GITHUB_TOKEN
      # do not start other workflows, so this cannot loop.
      - name: Commit PDF to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/paper.pdf
          if git diff --cached --quiet; then
            echo "paper.pdf unchanged"
            exit 0
          fi
          git commit -m "Rebuild paper.pdf from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
