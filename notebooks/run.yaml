# MRRpy configuration
# Written by `MRRpy ConfigForm` on 2026-10-01.
#
#   Check it:              MRRpy validate -c <this file>
#   Run it:                MRRpy run -c <this file>
#   Explain a setting:     MRRpy explain <NAME>
#   Change it by questions: MRRpy wizard --edit <this file>
#
# Settings with a fixed list of options accept the name or its number.
# Relative paths are relative to the folder you run MRRpy from.


# =============================================================================
# 1. Basin, terrain and results folder
# Where your basin is, which elevation data to use, and where results go.
# =============================================================================

# Elevation model (DEM) file — A GeoTIFF of ground elevation covering your
# basin, in any projection. Leave it empty to download a DEM from Google Earth
# Engine instead.
DEM_PATH: ''

# Area to download (west, south, east, north) — Only used when no DEM file is
# given: the box to download, in longitude/latitude degrees, e.g. 85.1, 27.5,
# 85.6, 27.9. Make it a little larger than the basin.
#   null means: no download.
DEM_BOUNDS_WGS84: [85.1919, 27.5369, 85.5272, 27.8194]

# DEM dataset to download — Which global elevation dataset to download. 'MRRpy
# list-dems' compares coverage and resolution.
#   Choices (name or number): 0=nasadem, 1=srtm, 2=merit, 3=alos,
#   4=copernicus_glo30, 5=fabdem, 6=usgs_3dep_1m, 7=gmted2010
DEM_SOURCE: alos

# Download resolution (m) — Average the downloaded DEM to this pixel size (e.g.
# 90 for faster runs). Empty keeps the dataset's native resolution.
#   null means: native resolution.
DEM_SCALE_M: 90.0

# Basin outlet (latitude, longitude) — The river point your basin drains to.
# MRRpy delineates everything upstream of it and reports the flow there.
# Latitude first, e.g. 27.6322, 85.2933.
OUTPUT_POINT: [27.632222, 85.293333]

# Map projection for the model grid — A projected coordinate system in metres,
# as an EPSG code. The UTM zone of your outlet is a safe choice, and MRRpy
# suggests it for you.
TARGET_CRS_EPSG: EPSG:32645

# Results folder — Where every output is written. It is created if it does not
# exist.
OUTPUT_DIR: output/

# Google Earth Engine project — Only needed for options that download data from
# Earth Engine (DEM download, IMERG rain, global curve numbers, soil and land-
# cover maps). Leave it empty to work offline. The GEE_PROJECT environment
# variable works too.
#   null means: not set (offline).
GEE_PROJECT: ee-074bce151saurav


# =============================================================================
# 2. Rainfall
# How much rain falls, where and when.
# =============================================================================

# Rainfall input — Where the rain comes from.
#   Choices (name or number): 0=uniform, 1=thiessen, 2=idw, 3=imerg_thiessen,
#   4=imerg_idw
PRECIP_METHOD: imerg_thiessen

# Storm start (UTC) — When the event starts, as 'YYYY-MM-DD HH:MM' in UTC. Sets
# the satellite rain window and the date of the satellite soil-moisture map.
#   null means: not set.
EVENT_START_UTC: 2024-09-26 00:00

# Download IMERG again — Ignore IMERG files cached in the results folder and
# download them again.
PRECIP_IMERG_FORCE_DOWNLOAD: true


# =============================================================================
# 3. Runoff
# How the ground splits rain into runoff and water that soaks in.
# =============================================================================

# Runoff method — How rain is split into runoff and water that soaks into the
# ground.
#   Choices (name or number): 0=none, 1=coefficient, 2=raster, 3=scs_cn,
#   4=physical
RUNOFF_SOURCE: physical

# Processes to include — Pick any combination; they are combined per cell
# without counting water twice.
#   Choices (name or number): 0=impervious, 1=infiltration_excess,
#   2=saturation_excess  — a list
RUNOFF_MECHANISMS: [impervious, infiltration_excess]

# Impervious areas from — Where the paved / built-up fraction of each cell
# comes from.
#   Choices (name or number): 0=none, 1=lcz, 2=lulc, 3=raster
IMPERVIOUS_SOURCE: lcz

# Soil suction from — Green-Ampt wetting-front suction: one value or from soil
# texture.
#   Choices (name or number): 0=scalar, 1=texture
GA_SUCTION_SOURCE: texture

# Soil suction head (m) — Green-Ampt wetting-front suction (loam about 0.1 to
# 0.2 m). Also fills gaps in the texture map.
GA_SUCTION_M: 0.15

# Infiltration rate from — Where the soil's vertical infiltration rate (Ksat)
# comes from.
#   Choices (name or number): 0=scalar, 1=gee, 2=raster
GA_KSAT_SOURCE: gee

# Soil infiltration rate (vertical Ksat) (mm/h) — How fast saturated soil soaks
# up water: sand about 50, loam about 10, clay about 1 mm/h. Also fills gaps in
# a map.
GA_KSAT_MMHR: 12.0

# Soil storage from — Where the soil's water-storage capacity and starting
# dryness come from.
#   Choices (name or number): 0=manual, 1=gee
VSA_SD_SOURCE: gee

# Root-zone depth (soil storage) (m) — Depth of soil that can hold water before
# it saturates. Replaced by satellite estimates when soil storage comes from
# SERVES.
VSA_SD_MAX_INITIAL: 0.1

# Satellite for soil moisture (SERVES) — Which satellite's land-surface data
# SERVES uses.
#   Choices (name or number): 0=landsat, 1=sentinel2, 2=modis
SERVES_SATELLITE: modis

# SoilGrids depth — Which soil layer to read from SoilGrids.
#   Choices (name or number): 0=b0, 1=b10, 2=b30, 3=b60, 4=b100, 5=b200
SOILGRIDS_DEPTH: b0


# =============================================================================
# 4. Roughness and river channels
# How rough the ground is and how river channels are shaped.
# =============================================================================

# Ground roughness from — Where Manning's n (surface roughness) of each cell
# comes from.
#   Choices (name or number): 0=scalar, 1=lulc, 2=lcz, 3=raster
MANNINGS_N_SOURCE: lulc

# Manning's n of the ground — Surface roughness: pavement about 0.015, grass
# 0.03 to 0.05, forest about 0.1. Also fills gaps in maps.
MANNINGS_N: 0.09

# Manning's n in river channels — Roughness used on river-channel cells instead
# of the ground value: one number, a value per stream order, values by
# elevation, or a raster.
#   Forms: Same as the ground (no channel override); One value for every river
#   cell; A value per stream order; Values by elevation band; From a raster of
#   n on river cells
#   null means: same as the ground.
MANNINGS_N_CHANNEL: 0.035

# Bankfull flow (about the 2-year flood) — The flow the river carries before
# spilling onto its floodplain. Automatic uses a global estimate at the outlet
# (Earth Engine when available, otherwise drainage area), usually within a
# factor of 2. Or give your 2-year flood, or a regional formula.
#   Forms: Automatic global estimate (no data needed); My 2-year flood at the
#   outlet or a gauge; A formula or regional preset
#   null means: automatic global estimate.
CHANNEL_QBF_M3S: 500.0

# …measured at a gauge draining (km²) — Drainage area of the gauge your 2-year
# flood comes from. Empty means the basin outlet.
#   null means: the basin outlet.
CHANNEL_QBF_AREA_KM2: null


# =============================================================================
# 5. Routing and simulation time
# How water moves downhill through the grid, and for how long to simulate.
# =============================================================================

# Routing method — How water moves from cell to cell.
#   Choices (name or number): 0=kinematic, 1=diffusive, 2=muskingum, 3=dynamic,
#   4=diffusive_implicit
ROUTING_SCHEME: diffusive_implicit

# Simulation length (hours) — How long to simulate, from the start of the rain.
TOTAL_SIMULATION_TIME_HOURS: 96.0

# Save results every (seconds) — How often the hydrograph (and any maps) are
# recorded.
OUTPUT_INTERVAL_SECONDS: 600


# =============================================================================
# 6. Outputs and computer
# Extra results to record, and whether to use the CPU or a GPU.
# =============================================================================

# Virtual gauges — Extra points where depth and flow are recorded (gauges.csv),
# one per line as 'name, latitude, longitude'. Each snaps to the nearest river
# cell.
#   A list of points, each {name, lat, lon} (optional: snap_to_channel,
#   snap_radius_cells; or row/col, easting/northing).
#   null means: none.
ROUTING_GAUGES: null

# Save maps over time — Record depth, velocity and discharge maps at every
# output time, for flood maps and animations.
SAVE_FIELDS: false

# Computer to run on — A GPU can be much faster for large grids. If no GPU is
# found MRRpy falls back to the CPU and says so.
#   Choices (name or number): 0=cpu, 1=gpu
BACKEND: cpu


