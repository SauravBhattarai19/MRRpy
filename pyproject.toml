[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pymrr"
version = "0.2.0"
description = "pymrr (Multi-Mechanism Runoff and Routing): a distributed, physics-based hydrological + hydrodynamic model — DEM preprocessing, gauge/IMERG precipitation, VSA + Green-Ampt + impervious runoff generation, and kinematic/diffusive-wave/Muskingum–Cunge/local-inertial dynamic-wave routing, with optional Google Earth Engine forcing and CPU/GPU backends."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Saurav Bhattarai", email = "bhattaraisaurav36@gmail.com" },
]
keywords = [
    "hydrology", "hydrodynamics", "watershed", "runoff", "flood",
    "routing", "kinematic wave", "diffusive wave", "muskingum-cunge",
    "VSA", "OPM", "green-ampt", "GIS", "rainfall-runoff", "earth-engine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pysheds",
    "pyflwdir",
    "fiona",
    "pyyaml",
]

[project.optional-dependencies]
# GPU acceleration (requires CUDA 12.x)
gpu = ["cupy-cuda12x"]
# Google Earth Engine features (IMERG rainfall, SERVES deficit, SoilGrids, LULC/LCZ)
gee = ["earthengine-api"]
# Interactive DEM_BOUNDS_WGS84 picker for Jupyter (see notebooks/pick_dem_bounds.ipynb).
# Kept separate from [gee] so headless/script users aren't forced into ipywidgets/ipyleaflet.
notebook = ["geemap", "ipyleaflet", "ipywidgets"]

[project.scripts]
pymrr = "pymrr.cli.main:main"

[project.urls]
Homepage = "https://github.com/SauravBhattarai19/pymrr"
Documentation = "https://pymrr.readthedocs.io"
Issues = "https://github.com/SauravBhattarai19/pymrr/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "qgis_plugin/tests"]
python_files = ["test_*.py"]
# tests/test_random.py is a data-prep scratch script, not a test suite.
addopts = "-ra --ignore=tests/test_random.py"

[tool.setuptools.packages.find]
include = ["pymrr*"]

[tool.setuptools.package-data]
pymrr = ["data/*.csv"]
