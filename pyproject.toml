[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "MRRpy"
version = "1.0.0"
description = "MRRpy (Multi-Mechanism Runoff and Routing): distributed, physics-based rainfall-runoff, flood routing and flood maps from a DEM and a storm: gauge, NASA IMERG or weather-model rain; SCS-CN, Green-Ampt, VSA and impervious runoff; kinematic, Muskingum-Cunge or semi-implicit diffusive routing; HAND or 2D flood depth maps; optional Google Earth Engine data and NVIDIA GPU."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Saurav Bhattarai", email = "bhattaraisaurav36@gmail.com" },
]
keywords = [
    "hydrology", "hydrodynamics", "watershed", "runoff", "flood",
    "routing", "kinematic wave", "diffusive wave", "muskingum-cunge",
    "flood mapping", "inundation", "HAND", "flood forecasting",
    "VSA", "OPM", "green-ampt", "GIS", "rainfall-runoff", "earth-engine",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pysheds",
    "pyflwdir",
    "affine<3",   # pyflwdir numba kernels (dem_adjust) cannot type affine>=3
    "fiona",
    "pyyaml",
]

[project.optional-dependencies]
# GPU acceleration (requires CUDA 12.x)
gpu = ["cupy-cuda12x[ctk]"]   # [ctk] ships the CUDA headers CuPy needs to JIT kernels
# Google Earth Engine features (IMERG rainfall, SERVES deficit, SoilGrids, LULC/LCZ)
gee = ["earthengine-api"]
# Jupyter extras: the configuration form (MRRpy.ConfigForm, needs ipywidgets 8) with
# its map picker, and the DEM_BOUNDS_WGS84 picker (notebooks/pick_dem_bounds.ipynb).
# Both draw with plain ipyleaflet, so no Earth Engine sign-in is needed just to draw.
# Kept separate from [gee] so headless/script users aren't forced into ipywidgets/ipyleaflet.
notebook = ["ipyleaflet", "ipywidgets>=8"]
# Optional observed-flow retrieval for USGS gauge comparisons.
usgs = ["dataretrieval>=1.3"]
# Everything that works on any machine: Earth Engine + Jupyter form + USGS.
# GPU stays separate (needs an NVIDIA GPU + CUDA 12.x): pip install "MRRpy[all,gpu]".
all = ["MRRpy[gee,notebook,usgs]"]

[project.scripts]
MRRpy = "MRRpy.cli.main:main"

[project.urls]
Homepage = "https://github.com/SauravBhattarai19/MRRpy"
Documentation = "https://mrrpy.readthedocs.io"
Issues = "https://github.com/SauravBhattarai19/MRRpy/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "MRRpy_plugin/tests"]
python_files = ["test_*.py"]
# tests/test_random.py is a data-prep scratch script, not a test suite.
addopts = "-ra --ignore=tests/test_random.py"

[tool.setuptools.packages.find]
include = ["MRRpy*"]

[tool.setuptools.package-data]
MRRpy = ["data/*.csv"]
