# Read the Docs build config — https://docs.readthedocs.io/en/stable/config-file/
# Hosts the mkdocs site (docsite/ + mkdocs.yml) at mrrpy-nepal.readthedocs.io
# (Read the Docs project 'mrrpy-nepal', default branch MRRpy-Nepal).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # install MRRpy so mkdocstrings can import it for the API reference
    - method: pip
      path: .
    - requirements: docs-requirements.txt
